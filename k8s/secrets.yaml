# ---------------------------------------------------------------------------
# secrets.yaml — ExternalSecret placeholders for MAOS credentials
#
# Uses the external-secrets operator to sync secrets from Vault/AWS SM/GCP SM.
# No actual secret values are stored in this file.
#
# Requirements: 9.10, TC-13
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: maos-secrets
  namespace: maos
  labels:
    app.kubernetes.io/part-of: maos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: maos-secrets
    creationPolicy: Owner
  data:
    # Postgres password
    - secretKey: MAOS_POSTGRES_PASSWORD
      remoteRef:
        key: maos/database
        property: password

    # Redis password (if auth enabled)
    - secretKey: MAOS_REDIS_PASSWORD
      remoteRef:
        key: maos/redis
        property: password

    # LLM provider API keys
    - secretKey: MAOS_ANTHROPIC_API_KEY
      remoteRef:
        key: maos/llm
        property: anthropic_api_key

    - secretKey: MAOS_OPENAI_API_KEY
      remoteRef:
        key: maos/llm
        property: openai_api_key

    - secretKey: MAOS_GOOGLE_API_KEY
      remoteRef:
        key: maos/llm
        property: google_api_key

    # AWS credentials (for Bedrock)
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: maos/aws
        property: access_key_id

    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: maos/aws
        property: secret_access_key

    # Sentry DSN
    - secretKey: MAOS_SENTRY_DSN
      remoteRef:
        key: maos/observability
        property: sentry_dsn

    # OAuth2 signing secret for token validation
    - secretKey: MAOS_OAUTH2_JWKS_URL
      remoteRef:
        key: maos/auth
        property: jwks_url

    - secretKey: MAOS_OAUTH2_ISSUER
      remoteRef:
        key: maos/auth
        property: issuer
