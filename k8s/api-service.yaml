# ---------------------------------------------------------------------------
# api-service.yaml — ClusterIP Service for maos-api
#
# Requirements: 14.5, TC-12
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: maos-api
  namespace: maos
  labels:
    app.kubernetes.io/name: maos-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: maos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: maos-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
