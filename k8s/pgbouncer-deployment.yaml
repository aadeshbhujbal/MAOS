# ---------------------------------------------------------------------------
# pgbouncer-deployment.yaml — PgBouncer connection pooler for MAOS
#
# PgBouncer sits between API/worker pods and Postgres, providing connection
# pooling and limiting the number of backend connections. Critical for
# horizontal scaling at ~500,000 users.
#
# Requirements: 14.3, 14.5, TC-5, TC-12
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maos-pgbouncer
  namespace: maos
  labels:
    app.kubernetes.io/name: maos-pgbouncer
    app.kubernetes.io/component: pgbouncer
    app.kubernetes.io/part-of: maos
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: maos-pgbouncer
      app.kubernetes.io/component: pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maos-pgbouncer
        app.kubernetes.io/component: pgbouncer
        app.kubernetes.io/part-of: maos
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgbouncer
          image: bitnami/pgbouncer:1.22.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: pgbouncer
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRESQL_HOST
              value: "maos-postgres.maos.svc.cluster.local"
            - name: POSTGRESQL_PORT
              value: "5432"
            - name: POSTGRESQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: maos-config
                  key: MAOS_POSTGRES_DB
            - name: POSTGRESQL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: maos-config
                  key: MAOS_POSTGRES_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maos-secrets
                  key: MAOS_POSTGRES_PASSWORD
            # PgBouncer configuration for high-concurrency
            - name: PGBOUNCER_POOL_MODE
              value: "transaction"
            - name: PGBOUNCER_MAX_CLIENT_CONN
              value: "1000"
            - name: PGBOUNCER_DEFAULT_POOL_SIZE
              value: "50"
            - name: PGBOUNCER_MIN_POOL_SIZE
              value: "10"
            - name: PGBOUNCER_RESERVE_POOL_SIZE
              value: "10"
            - name: PGBOUNCER_RESERVE_POOL_TIMEOUT
              value: "3"
            - name: PGBOUNCER_SERVER_IDLE_TIMEOUT
              value: "600"
            - name: PGBOUNCER_SERVER_LIFETIME
              value: "3600"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi
---
# PgBouncer Service
apiVersion: v1
kind: Service
metadata:
  name: maos-pgbouncer
  namespace: maos
  labels:
    app.kubernetes.io/name: maos-pgbouncer
    app.kubernetes.io/component: pgbouncer
    app.kubernetes.io/part-of: maos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: maos-pgbouncer
    app.kubernetes.io/component: pgbouncer
  ports:
    - name: pgbouncer
      port: 5432
      targetPort: pgbouncer
      protocol: TCP
